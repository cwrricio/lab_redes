[project]
name = "lab-sntp-client"
version = "0.1.0"
description = "Cliente SNTP didático (RFC 4330) — laboratório de Redes"
readme = "README.md"
requires-python = ">=3.10"
# Sem dependências externas: usamos apenas a biblioteca padrão (socket/struct).
dependencies = []

[project.scripts]
sntp-client = "sntp_client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["sntp_client.py"]
