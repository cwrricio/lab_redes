# Configuração do vsftpd para o laboratório (comentada para apresentação).
# IMPORTANTE: o vsftpd NÃO aceita comentário na mesma linha de uma diretiva;
# cada comentário precisa ficar em sua própria linha começando com '#'.

listen=YES
listen_ipv6=NO

# --- Usuários -------------------------------------------------------------
# anonymous_enable=NO  -> sem login anônimo
# local_enable=YES     -> usuários locais do sistema podem logar
# write_enable=YES     -> permite upload/escrita
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

# --- Chroot ---------------------------------------------------------------
# chroot_local_user=YES     -> prende o usuário no próprio diretório home
# allow_writeable_chroot=YES-> necessário porque o home é gravável
chroot_local_user=YES
allow_writeable_chroot=YES

# --- Modo passivo (PASV) --------------------------------------------------
# O FTP usa DOIS canais: controle (21) e dados. No modo passivo o SERVIDOR
# abre uma porta na faixa abaixo e informa ao cliente. Fixamos a faixa para
# conseguir mapear no Docker e atravessar NAT/firewall.
# pasv_address é injetado pelo entrypoint via variável de ambiente.
pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

# --- Mensagens e logs -----------------------------------------------------
# log_ftp_protocol=YES loga os comandos do protocolo (ótimo para a demo).
# Atenção: log_ftp_protocol é INCOMPATÍVEL com xferlog_std_format=YES.
dirmessage_enable=YES
xferlog_enable=YES
log_ftp_protocol=YES
ftpd_banner=Bem-vindo ao servidor FTP do laboratorio de Redes.

# --- Observação sobre segurança (ver README) ------------------------------
# FTP puro envia usuário, senha E dados em TEXTO CLARO. Para FTPS bastaria
# habilitar ssl_enable=YES + certificado. Mantemos texto claro de propósito
# para CONSEGUIR capturar as credenciais no Wireshark e mostrar o problema.
seccomp_sandbox=NO
pasv_promiscuous=NO
