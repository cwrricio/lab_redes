# Configuração do chrony como SERVIDOR de horário para o laboratório.

# --- Fontes de tempo upstream (stratum superior) --------------------------
# O servidor se sincroniza com o pool público da NTP Pool Project. Se o
# laboratório estiver OFFLINE, comente as linhas "pool" e descomente "local"
# mais abaixo para operar como fonte isolada.
pool pool.ntp.org iburst

# --- Quem pode consultar este servidor ------------------------------------
# Libera a sub-rede do laboratório (e localhost por padrão).
allow 172.30.0.0/24
allow 127.0.0.1

# --- Modo offline / stratum local -----------------------------------------
# Permite que este servidor responda mesmo sem upstream, anunciando-se como
# stratum 10. Útil para demonstração sem internet.
local stratum 10

# Arquivo de drift: estima o erro sistemático do oscilador do relógio.
driftfile /var/lib/chrony/chrony.drift

# Loga medições e estatísticas (úteis para inspecionar com chronyc).
logdir /var/log/chrony
log measurements statistics tracking
